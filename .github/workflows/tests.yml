name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hloc-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  VECLIB_MAXIMUM_THREADS: "2"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  unit:
    name: Mocked core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.12"
      - name: Install test dependencies
        run: python -m pip install --only-binary=:all: -r .github/ci-requirements.txt
      - name: Run mocked core tests
        run: python -m pytest tests --ignore=tests/test_native_pose.py --junitxml=unit-results.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-results-${{ matrix.os }}
          path: unit-results.xml
          retention-days: 7
          if-no-files-found: ignore

  native:
    name: Native pose tests (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.12"
      - name: Install test dependencies and COLMAP wheel
        run: python -m pip install --only-binary=:all: -r .github/ci-requirements.txt pycolmap==4.2.1
      - name: Run synthetic native geometry tests
        run: python -m pytest tests/test_native_pose.py --junitxml=native-results.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-results-ubuntu
          path: native-results.xml
          retention-days: 7
          if-no-files-found: ignore
