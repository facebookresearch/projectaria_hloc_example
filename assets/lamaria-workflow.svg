<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img" aria-labelledby="title desc">
  <title id="title">Indoor LaMAria HLOC workflow</title>
  <desc id="desc">An original Aria Gen 1 indoor VRS is processed by public MPS. Selected RGB keyframes build the visual map. Other frames query it; this remains a same-recording demonstration. Native two-camera queries are optional and VIO is not recorded.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
  <rect width="960" height="230" rx="14" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"><rect x="20" y="62" width="205" height="96" rx="10"/><rect x="258" y="62" width="200" height="96" rx="10"/><rect x="494" y="22" width="200" height="82" rx="10"/><rect x="494" y="128" width="200" height="82" rx="10"/><rect x="732" y="62" width="208" height="96" rx="10"/></g>
    <g fill="#0f172a" font-size="17" font-weight="600"><text x="122" y="94">Indoor R_03_easy</text><text x="358" y="94">Original MPS SLAM</text><text x="594" y="52">Mapping keyframes</text><text x="594" y="157">Other query frames</text><text x="836" y="93">Metric HLOC map</text></g>
    <g fill="#475569" font-size="13"><text x="122" y="119">Gen 1 · raw RGB VRS</text><text x="122" y="140">1.14 GB · about 158 s</text><text x="358" y="119">Trajectory + online calibration</text><text x="358" y="140">Normal public account flow</text><text x="594" y="76">RGB known-pose triangulation</text><text x="594" y="181">RGB / native two-camera PnP</text><text x="836" y="118">Sparse landmarks + solved poses</text><text x="836" y="140">No dense model dependency</text></g>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M225 110 H258"/><path d="M458 110 H476 V63 H494"/><path d="M476 110 V169 H494"/><path d="M694 63 H714 V93 H732"/><path d="M694 169 H714 V125 H732"/></g>
  <text x="28" y="217" fill="#475569" font-size="12" font-family="system-ui, sans-serif">Same recording, different frames — not an independent-recording accuracy benchmark. R_03 has no recorded VIO.</text>
</svg>
