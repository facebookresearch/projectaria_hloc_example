<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc"><title id="title">Two recording map, third recording query, map-frame VIO</title><desc id="desc">Play zero and play two mapping inputs use MPS calibrated known poses. An independent play one recording uses image retrieval, feature matching and PnP to produce capture-time visual fixes. Fixes align recorded VIO to the map frame. MPS query reference poses are used only for diagnostics.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1827"/><stop offset="1" stop-color="#132A3D"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#70BFFF"/></marker></defs><rect width="1400" height="440" rx="24" fill="url(#bg)"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="48" fill="#F1F7FF" font-size="25" font-weight="700">From Aria recordings to continuous map-frame poses</text><text x="38" y="79" fill="#A8BED5" font-size="16">Public tools · calibrated geometry · one resident map/model session · no hosted localization service</text><g fill="#172F43" stroke="#395B78" stroke-width="1.5"><rect x="38" y="116" width="285" height="127" rx="13"/><rect x="379" y="116" width="285" height="127" rx="13"/><rect x="720" y="116" width="292" height="127" rx="13"/><rect x="1068" y="116" width="294" height="127" rx="13"/><rect x="38" y="288" width="285" height="100" rx="13"/><rect x="379" y="288" width="633" height="100" rx="13"/><rect x="1068" y="288" width="294" height="100" rx="13"/></g><g fill="#ECF4FF" font-size="20" font-weight="700"><text x="58" y="151">01  MAP INPUTS</text><text x="399" y="151">02  HLOC MAP</text><text x="740" y="151">03  VISUAL FIX</text><text x="1088" y="151">04  MAPPED VIO</text><text x="58" y="322">INDEPENDENT QUERY</text><text x="399" y="322">CAPTURE-TIME ALIGNMENT</text><text x="1088" y="322">RERUN</text></g><g fill="#AFC7DE" font-size="16"><text x="58" y="184">play_0 + play_2</text><text x="58" y="211">VRS + original public MPS</text><text x="399" y="184">SuperPoint / LightGlue</text><text x="399" y="211">Known-pose triangulation</text><text x="740" y="184">Retrieval → matching → pose</text><text x="740" y="211">RGB PnP / four-camera gPnP</text><text x="1088" y="184">Propagate device VIO</text><text x="1088" y="211">Output in the HLOC map frame</text><text x="58" y="355">play_1 images stay out of map</text><text x="399" y="355">T_map_odometry = T_map_device_fix · inverse(T_odometry_device_capture)</text><text x="1088" y="355">Map · pose · RGB · diagnostics</text></g><g stroke="#70BFFF" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M323 181H372"/><path d="M664 181H713"/><path d="M1012 181H1061"/><path d="M323 338H372"/><path d="M860 288V251"/><path d="M1205 243V280"/></g><text x="39" y="423" fill="#8CAAC4" font-size="14">MPS query poses are reference diagnostics only — never a retrieval or pose prior. Reference agreement is not independent physical ground truth.</text></g></svg>
